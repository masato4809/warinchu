const upgradePacking=(a)=>{
 const renames={'航空券・ホテルの予約情報':'航空券控え・ホテル予約確認書','海外旅行保険の連絡先':'海外旅行保険証（ソニー損保）','クレジットカード・現金':'クレジットカード・海外対応デビットカード','スマホ・充電器':'スマートフォン・充電ケーブル','変換プラグ（必要か確認）':'変換プラグ（基本不要）'};

 a.version=5;
};

const iconType=t=>({'観光':'📸','グルメ':'🍜','移動':'🚆','学会':'🎤','発表':'🎯','宿泊':'🏨','食事':'🍜','買い物':'🛍️','その他':'📌'}[t]||'📌');
const yen=v=>Math.round(Number(v)||0).toLocaleString('ja-JP');
const twd=v=>Number(v||0).toLocaleString('ja-JP',{maximumFractionDigits:2});
const days=()=>{let a=dd(data.trip.start),b=dd(data.trip.end);if(isNaN(a)||isNaN(b)||a>b)return [data.trip.start||'2026-11-19'];let out=[];for(let i=0;i<30&&a<=b;i++){out.push(a.toISOString().slice(0,10));a.setDate(a.getDate()+1)}return out};
const checkDates=()=>{if(!days().includes(selectedDate))selectedDate=days()[0]};
function nav(){document.getElementById('desktopNav').innerHTML=navs.map(([id,ic,label])=>`<button data-page="${id}" class="${page===id?'active':''}" aria-current="${page===id?'page':'false'}"><span class="ico">${ic}</span>${label}</button>`).join('')+`<button data-page="settings" class="${page==='settings'?'active':''}"><span class="ico">⚙</span>設定・バックアップ</button>`;document.getElementById('mobileNav').innerHTML=navs.map(([id,ic,label])=>`<button data-page="${id}" class="${page===id?'active':''}" aria-label="${label}"><span class="mi">${ic}</span>${label}</button>`).join('')}
const section=(title,subtitle,action,label)=>`<div class="section-header"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${action?`<button class="add-btn" data-action="${action}">＋ ${label||'追加'}</button>`:''}</div>`;
const empty=(icon,title,desc)=>`<div class="empty"><div class="big">${icon}</div><strong>${title}</strong>${safe(desc)}</div>`;
function itemTools(kind,id){return `<div class="tools"><button class="icon-btn" title="編集" aria-label="編集" data-action="edit-${kind}" data-id="${safe(id)}">✎</button><button class="icon-btn" title="削除" aria-label="削除" data-action="delete-${kind}" data-id="${safe(id)}">×</button></div>`}
function home(){const count=data.packing.filter(x=>x.checked).length;const today=days()[0];let upcoming=[...data.schedule].sort((a,b)=>(a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||''))).slice(0,3);const expJPY=data.expenses.filter(x=>x.currency==='JPY').reduce((n,x)=>n+Number(x.amount||0),0);const expTWD=data.expenses.filter(x=>x.currency==='TWD').reduce((n,x)=>n+Number(x.amount||0),0);return `<section class="hero"><div><div class="pre">✦ YOUR NEXT ADVENTURE</div><h1>${safe(data.trip.name||'台湾旅行')}<br><span style="color:#8fe6c0">旅のしおり</span></h1><div class="sub">${dateFmt(data.trip.start)} — ${dateFmt(data.trip.end)}<br>${data.trip.companions?safe(data.trip.companions)+' と一緒に':'思い出も、準備も、ここにまとめよう。'}</div></div><div class="taiwan-graphic"><div class="float-flag">TAIWAN ✦</div><div class="island">🇹🇼</div></div></section>
<div class="stat-grid"><div class="stat"><div class="stat-top">📅 旅行日数</div><div class="num">${days().length}<span style="font-size:13px"> 日</span></div><div class="small">予定は ${data.schedule.length} 件</div></div><div class="stat"><div class="stat-top">✅ 準備完了</div><div class="num">${count}<span style="font-size:13px"> / ${data.packing.length}</span></div><div class="small">持ち物チェック</div></div><div class="stat"><div class="stat-top">💳 支出記録</div><div class="num">${data.expenses.length}<span style="font-size:13px"> 件</span></div><div class="small">¥${yen(expJPY)} / NT$${twd(expTWD)}</div></div></div>
${section('クイックアクセス','旅の準備をまとめて管理')}<div class="quick-grid"><button class="quick" data-page="schedule"><span class="quick-icon">🗓️</span><span class="quick-txt">スケジュール</span></button><button class="quick" data-page="shuttle"><span class="quick-icon">🚌</span><span class="quick-txt">シャトル時刻表</span></button><button class="quick" data-page="places"><span class="quick-icon">📍</span><span class="quick-txt">行きたい場所</span></button><button class="quick" data-page="souvenirs"><span class="quick-icon">🎁</span><span class="quick-txt">お土産・メモ</span></button><button class="quick" data-page="bookings"><span class="quick-icon">🎫</span><span class="quick-txt">予約情報</span></button></div>
<div class="two" style="margin-top:4px"><div>${section('旅行の予定','','add-schedule','予定を追加')}${upcoming.length?`<div class="item-list">${upcoming.map(e=>`<div class="item"><div class="tile">${iconType(e.type)}</div><div class="grow"><div class="item-title">${safe(e.title)}</div><div class="item-sub">${dateFmt(e.date)} ${safe(e.time||'時間未定')} · ${safe(e.place||'場所未定')}</div></div></div>`).join('')}</div>`:empty('🗓️','予定がまだありません','日程を追加しよう')}</div><div>${section('持ち物の準備','','','')}<div class="panel"><div class="content-flex"><strong>${count} / ${data.packing.length} 完了</strong><span class="muted tiny">${data.packing.length?Math.round(count/data.packing.length*100):0}%</span></div><div class="progress"><span style="width:${data.packing.length?count/data.packing.length*100:0}%"></span></div><button class="view-all" data-page="packing">持ち物を確認 →</button></div><div class="note-card" style="margin-top:12px"><strong>✈ 旅行メモ</strong><div class="longtext" style="font-size:12px;margin-top:7px">${safe(data.trip.memo||'設定から自由にメモを追加できます。')}</div></div></div></div>`}
function schedule(){checkDates();const all=days();const daily=data.schedule.filter(x=>x.date===selectedDate).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));return `<h1 class="subheading">旅のスケジュール</h1><p class="page-intro">TAAI 2026 · 11/19(木)〜11/22(日) ／ 時刻は日本・台湾それぞれの現地時間</p><div class="date-tabs">${all.map((d,i)=>`<button class="date-tab ${selectedDate===d?'active':''}" data-action="select-date" data-date="${d}"><div class="month">DAY ${i+1}</div><div class="day">${dateFmt(d).split(' ')[0]}</div><div class="month">${dateFmt(d).split(' ')[1]||''}</div></button>`).join('')}</div><div class="day-banner"><strong>${safe(presetDayNames[selectedDate]||'旅行の予定')}</strong><span>${safe(dateFmt(selectedDate))} · ${daily.length} 件</span></div>${['2026-11-20','2026-11-21'].includes(selectedDate)?`<div class="schedule-bus-link"><div><strong>🚌 無料シャトルの時刻表</strong><p>${selectedDate==='2026-11-20'?'往路 Bus 2 08:40〜09:30 ／ 帰路 Bus 4 20:20〜21:10':'往路 Bus 1・2 も運行 ／ 帰路 Bus 6 17:20〜18:10'}</p></div><button class="secondary-btn" data-page="shuttle">全6便を見る →</button></div>`:''}${section('この日の行動予定','時刻・場所・注意事項をタップして編集','add-schedule','予定を追加')}<div class="item-list">${daily.length?daily.map(e=>`<div class="item ${e.important?'important':''}"><div class="item-time">${safe(e.timeLabel||e.time||'未定')}</div><div class="tile">${iconType(e.type)}</div><div class="grow"><div class="item-title">${safe(e.title)} ${e.important?'<span class="pill warm">重要</span>':''}</div><div class="item-sub">${safe(e.place||'場所未定')} <span class="pill">${safe(e.type||'その他')}</span></div>${e.note?`<div class="item-note">${safe(e.note)}</div>`:''}</div>${itemTools('schedule',e.id)}</div>`).join(''):empty('🌿','まだ予定はありません','「予定を追加」から、この日の予定を登録しましょう。')}</div><p class="hint" style="margin-top:15px">※ この旅程は共有されたスケジュールを転記したものです。航空券・ホテル・学会公式案内で最新情報を確認してください。</p>`}

function places(){let rows=data.places.filter(p=>filter==='すべて'||(filter==='訪問済み'?p.visited:!p.visited));return `<h1 class="subheading">行きたいスポット</h1><p class="page-intro">気になる場所を保存。Googleマップはオンライン時に開けます。</p>${section('スポット一覧',`${data.places.length}件登録中`,'add-place','スポット追加')}<div class="filters">${['すべて','行きたい','訪問済み'].map(f=>`<button class="filter ${filter===f?'active':''}" data-action="filter" data-filter="${f}">${f}</button>`).join('')}</div><div class="item-list">${rows.length?rows.map(p=>`<div class="item"><div class="tile">${p.visited?'✅':'📍'}</div><div class="grow"><div class="item-title">${safe(p.name)}</div><div class="item-sub">${safe(p.area||'エリア未定')}</div>${p.note?`<div class="item-note">${safe(p.note)}</div>`:''}<div class="tag-row"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.name||'')+' '+(p.area||'台湾'))}" target="_blank" rel="noopener noreferrer" class="pill">↗ Googleマップ</a><button class="link-btn" data-action="visit-place" data-id="${safe(p.id)}">${p.visited?'未訪問に戻す':'✓ 訪問済みにする'}</button></div></div>${itemTools('place',p.id)}</div>`).join(''):empty('🧭','スポットがありません','気になる場所を追加しましょう。')}</div>`}
function budget(){const j=data.expenses.filter(x=>x.currency==='JPY').reduce((s,x)=>s+Number(x.amount||0),0);const t=data.expenses.filter(x=>x.currency==='TWD').reduce((s,x)=>s+Number(x.amount||0),0);const r=Number(data.trip.rate||0);const lim=Number(data.trip.budgetLimit||0);const combined=r>0?j+t*r:null;return `<h1 class="subheading">旅の予算・支出</h1><p class="page-intro">日本円と台湾ドルを別々に記録。換算レートも手動で設定できます。</p><div class="budget-summary"><div class="budget-total"><div><small>日本円の支出</small><div class="amount">¥ ${yen(j)}</div></div><div><small>台湾ドルの支出</small><div class="amount">NT$ ${twd(t)}</div></div></div><div class="foot">${combined===null?'換算なし（設定画面で1台湾ドルあたりの日本円を入力）':`設定レートで換算した合計 約 ¥${yen(combined)}`}${lim>0&&combined!==null?` / 予算 ¥${yen(lim)}`:''}</div>${lim>0&&combined!==null?`<div class="progress" style="background:#30675e"><span style="width:${Math.min(100,combined/lim*100)}%;background:#94e4c4"></span></div>`:''}</div>${section('支出の記録',`${data.expenses.length}件`,'add-expense','支出を追加')}<div class="item-list">${data.expenses.length?[...data.expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>`<div class="item"><div class="tile">${({'交通':'🚆','食事':'🍜','宿泊':'🏨','観光':'🎡','買い物':'🛍️','その他':'🧾'})[e.category]||'🧾'}</div><div class="grow"><div class="item-title">${safe(e.title)}</div><div class="item-sub">${safe(e.category||'その他')} · ${e.date?dateFmt(e.date):'日付未設定'}</div>${e.note?`<div class="item-note">${safe(e.note)}</div>`:''}</div><strong style="white-space:nowrap">${e.currency==='TWD'?'NT$':'¥'}${e.currency==='TWD'?twd(e.amount):yen(e.amount)}</strong>${itemTools('expense',e.id)}</div>`).join(''):empty('💰','まだ支出がありません','食事や交通費を記録できます。')}</div>`}
function packing(){const total=data.packing.length,complete=data.packing.filter(x=>x.checked).length;const preferred=['貴重品・書類・お金（機内持ち込み）','衣類・防寒・雨具（3泊4日）','日用品・衛生用品','デジタル機器・街歩きグッズ','学会・その他','以前のチェック項目'];const cats=[...new Set([...preferred.filter(cat=>data.packing.some(x=>x.category===cat)),...data.packing.map(x=>x.category||'その他')])];return `<h1 class="subheading">持ち物チェック</h1><p class="page-intro">出発前にチェック。タップすると完了にできます。</p><div class="panel"><div class="content-flex"><strong>${complete} / ${total} 完了</strong><span class="pill">${total?Math.round(complete/total*100):0}%</span></div><div class="progress"><span style="width:${total?complete/total*100:0}%"></span></div><form class="inline-form" id="addPacking"><input name="name" maxlength="100" placeholder="持ち物を追加（例：折りたたみ傘）" required aria-label="追加する持ち物"><button type="submit">＋</button></form></div>${cats.length?cats.map(cat=>`<div class="category-label">${safe(cat)}</div><div class="item-list">${data.packing.filter(x=>(x.category||'その他')===cat).map(x=>`<div class="check-row ${x.checked?'done':''}"><input type="checkbox" id="p-${safe(x.id)}" data-action="check-packing" data-id="${safe(x.id)}" ${x.checked?'checked':''}><label for="p-${safe(x.id)}"><span class="packing-name">${safe(x.name)}</span>${x.note?`<span class="packing-note">${safe(x.note)}</span>`:""}</label><button class="delete" aria-label="削除" data-action="delete-packing" data-id="${safe(x.id)}">×</button></div>`).join('')}</div>`).join(''):empty('🎒','持ち物がありません','上から持ち物を追加しましょう。')}`}
function souvenirs(){const bought=data.souvenirs.filter(x=>x.purchased).length;const sorted=[...data.souvenirs].sort((a,b)=>Number(!!a.purchased)-Number(!!b.purchased));return `<h1 class="subheading">🎁 お土産・メモ</h1><p class="page-intro">お土産の買い忘れ防止にも、旅先のちょっとした覚え書きにも。</p><div class="memo-board"><div class="memo-heading"><strong>✍️ なんでもメモ</strong><span class="pill">自動保存</span></div><p class="page-intro" style="margin:6px 0 10px">お店の名前、食べたいもの、待ち合わせ場所など自由に書けます。</p><textarea id="scratchpad" maxlength="5000" aria-label="旅行の自由メモ" placeholder="例：空港でパイナップルケーキを見る\n友人におすすめの夜市を聞く">${safe(data.trip.scratchpad||'')}</textarea><p class="hint">入力すると、この端末のブラウザに自動保存されます。</p></div>${section('お土産リスト',`${bought} / ${data.souvenirs.length} 個 購入済み`,'add-souvenir','お土産を追加')}<div class="item-list">${sorted.length?sorted.map(x=>`<div class="item ${x.purchased?'purchased':''}"><input type="checkbox" class="souvenir-checkbox" aria-label="${safe(x.name)}を購入済みにする" data-action="check-souvenir" data-id="${safe(x.id)}" ${x.purchased?'checked':''}><div class="tile">🎁</div><div class="grow"><div class="item-title">${safe(x.name)}</div><div class="memo-tags">${x.recipient?`<span>👤 ${safe(x.recipient)}</span>`:''}${x.shop?`<span>🏬 ${safe(x.shop)}</span>`:''}${x.amount?`<span>💰 ${safe(x.currency||'TWD')==='JPY'?'¥':'NT$'}${x.currency==='JPY'?yen(x.amount):twd(x.amount)}</span>`:''}<span>${x.purchased?'購入済み':'未購入'}</span></div>${x.note?`<div class="item-note">${safe(x.note)}</div>`:''}</div>${itemTools('souvenir',x.id)}</div>`).join(''):empty('🛍️','お土産リストはまだ空です','「お土産を追加」で買いたいものや渡す相手を記録できます。')}</div>${section('整理して残すメモ',`${data.notes.length} 件`,'add-note','メモを追加')}<div class="item-list">${data.notes.length?data.notes.map(x=>`<div class="item"><div class="tile">📝</div><div class="grow"><div class="item-title">${safe(x.title)}</div>${x.body?`<div class="item-note">${safe(x.body)}</div>`:''}</div>${itemTools('note',x.id)}</div>`).join(''):empty('📝','メモはまだありません','お店の情報や気になったことをタイトル付きで保存できます。')}</div>`}

function shuttle(){
 const groups=[
  {key:'morning',heading:'朝の往路 · 11/20（金）・11/21（土）',caption:'駅 → 学会会場',icon:'🌅'},
  {key:'evening20',heading:'11/20（金）の帰路',caption:'学会会場 → 駅',icon:'🌙'},
  {key:'evening21',heading:'11/21（土）の帰路',caption:'学会会場 → 駅',icon:'🌇'}
 ];
 const renderRow=b=>`<div class="bus-row ${b.planned?'bus-planned':''}"><div class="bus-number"><span class="bus-icon">🚌</span><strong>Bus ${safe(b.id)}</strong>${b.planned?'<span class="pill">利用予定</span>':''}</div><div class="bus-detail"><div class="bus-route"><span>${safe(b.from)}</span><span class="bus-arrow">↓</span><span>${safe(b.to)}</span></div><div class="bus-hours"><strong>${safe(b.depart)}</strong><span>→</span><strong>${safe(b.arrive)}</strong><small>出発 → 到着</small></div></div></div>`;
 return `<h1 class="subheading">🚌 学会シャトルバス</h1>
 <p class="page-intro">TAAI 2026 · 無料シャトルバス時刻表（共有画像から転記）</p>
 <div class="bus-lead"><div class="bus-lead-top"><span>✅ 旅行で利用予定の3便</span><span class="pill">現地時間</span></div>
  <div class="bus-mini-grid"><div><small>11/20 朝 · Bus 2</small><strong>08:40 → 09:30</strong><span>板橋HSR駅 → 会場</span></div><div><small>11/20 夜 · Bus 4</small><strong>20:20 → 21:10</strong><span>会場 → 板橋HSR駅</span></div><div><small>11/21 夕 · Bus 6</small><strong>17:20 → 18:10</strong><span>会場 → 板橋HSR駅</span></div></div>
 </div>
 ${groups.map(g=>`<div class="bus-group"><div class="bus-group-head"><div><h2>${g.icon} ${g.heading}</h2><p>${g.caption}</p></div><span class="pill gray">${shuttleTrips.filter(b=>b.dateGroup===g.key).length}便</span></div><div class="bus-list">${shuttleTrips.filter(b=>b.dateGroup===g.key).map(renderRow).join('')}</div></div>`).join('')}
 <div class="note-info" style="margin-top:17px"><i>📌</i><div><strong>乗る場所の詳細は要確認</strong><div style="margin-top:5px">資料に書かれているのは駅・会場の名称と発着時刻までです。駅のどの出口・バス停から乗るかは、学会側の現地案内を確認してください。上の「利用予定」は共有旅程に基づく印で、バスの予約・乗車を保証するものではありません。</div></div></div>`;
}
function bookings(){return `<h1 class="subheading">予約・重要情報</h1><p class="page-intro">飛行機、ホテル、学会の詳細などをメモできます。</p><div class="note-info safe"><i>🔒</i><div>内容はこの端末のブラウザに保存されます。<strong>パスポート番号、カード番号、パスワードなどの機密情報は保存しないでください。</strong> 電子チケットは公式アプリやPDFにも保存すると安心です。</div></div><div class="schedule-bus-link"><div><strong>🚌 学会の無料シャトルバス</strong><p>11/20・21の全6便を一覧表示できます。</p></div><button class="secondary-btn" data-page="shuttle">時刻表を見る →</button></div>${section('予約メモ',`${data.bookings.length}件`,'add-booking','予約を追加')}<div class="item-list">${data.bookings.length?data.bookings.map(x=>`<div class="item"><div class="tile">${({'航空券':'✈️','ホテル':'🏨','学会':'🎤','発表':'🎯','宿泊':'🏨','食事':'🍜','買い物':'🛍️','交通':'🚄','その他':'📄'})[x.type]||'📄'}</div><div class="grow"><div class="item-title">${safe(x.title)}</div><div class="item-sub">${safe(x.type||'その他')} · ${x.date?dateFmt(x.date):'日付未設定'}</div>${x.code?`<div class="item-note">予約の控え: ${safe(x.code)}</div>`:''}${x.note?`<div class="item-note">${safe(x.note)}</div>`:''}</div>${itemTools('booking',x.id)}</div>`).join(''):empty('🎫','予約メモがありません','航空券や宿の情報を追加しましょう。')}</div>`}
function settings(){return `<h1 class="subheading">旅の設定</h1><p class="page-intro">日程を編集したり、データをバックアップできます。</p><form id="tripSettings" class="setting-card"><h3>✈️ 旅行の基本情報</h3><div class="field"><label>旅行タイトル</label><input name="name" value="${safe(data.trip.name)}" maxlength="60" required></div><div class="setting-row"><div class="field"><label>出発日</label><input name="start" type="date" value="${safe(data.trip.start)}" required></div><div class="field"><label>帰国日</label><input name="end" type="date" value="${safe(data.trip.end)}" required></div></div><div class="field"><label>同行者メモ（任意）</label><input name="companions" value="${safe(data.trip.companions||'')}" maxlength="90" placeholder="例：友人と2人旅"></div><div class="field"><label>自由メモ</label><textarea name="memo" maxlength="2500">${safe(data.trip.memo||'')}</textarea></div><h3>💴 予算・通貨</h3><div class="setting-row"><div class="field"><label>1台湾ドル = 何円？（任意）</label><input name="rate" type="number" step="0.001" min="0" value="${safe(data.trip.rate||'')}" placeholder="ご自身で入力"></div><div class="field"><label>旅行予算（日本円・任意）</label><input name="budgetLimit" type="number" step="1" min="0" value="${safe(data.trip.budgetLimit||'')}" placeholder="例：30000"></div></div><button class="add-btn" type="submit">✓ 設定を保存</button></form><div class="setting-card"><h3>🗓 TAAI 2026 の旅程</h3><p>11月19日〜22日の共有スケジュールから、削除した予定などを重複せず再追加できます。自分で編集した内容はそのまま残します。</p><button class="secondary-btn" data-action="apply-itinerary" type="button">共有旅程を再追加</button></div><div class="setting-card"><h3>💾 データのバックアップ</h3><p>端末変更・ブラウザデータ消去に備えて、JSONファイルを定期的に保存してください。データは自動でクラウド共有されません。</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="add-btn" data-action="backup">⇩ JSONを書き出す</button><button class="secondary-btn" data-action="import">⇧ JSONを読み込む</button></div></div><div class="setting-card"><h3>📱 オフラインで使う方法</h3><p>このアプリをHTTPSのサイトとして公開し、iPhoneのSafariで一度読み込んで「ホーム画面に追加」すると、読み込み済み画面は通信なしでも使えるように設計されています。初回利用や更新時はネット接続が必要です。</p><p>単独のHTMLファイルで開いた場合も操作はできますが、端末・ブラウザによって保存が維持されないことがあります。こまめにJSONをバックアップしてください。</p></div><div class="setting-card"><h3>⚠️ 初期化</h3><p>この端末にある予定・お土産・メモ・持ち物・支出・予約のデータを初期状態に戻します。実行前にバックアップをおすすめします。</p><button class="secondary-btn" style="color:#bb5b4f;border-color:#f0d4cd" data-action="reset">すべて初期化</button></div>`}
function render(){nav();const views={home,schedule,shuttle,places,budget,packing,souvenirs,bookings,settings};document.getElementById('content').innerHTML=views[page]();document.getElementById('smallTitle').textContent=page==='home'?'台湾旅ノート':'';document.getElementById('eyebrow').textContent=page==='home'?'TRAVEL JOURNAL · 2026':'MY TAIWAN TRIP';}
const controls={
 schedule:[['date','日付','date'],['time','開始時刻（並び替え用）','time'],['timeLabel','表示する時刻・時間帯（例: 10:40〜12:00 / 午前中）','text'],['title','予定名','text'],['type','種類','select',types],['place','場所（任意）','text'],['note','メモ','textarea']],
 place:[['name','スポット名','text'],['area','エリア（任意）','text'],['note','メモ','textarea']],
 expense:[['title','内容','text'],['amount','金額','number'],['currency','通貨','select',['TWD','JPY']],['category','カテゴリ','select',categories],['date','日付','date'],['note','メモ','textarea']],
 booking:[['title','予約・情報名','text'],['type','種類','select',['航空券','ホテル','学会','交通','その他']],['date','日付','date'],['code','確認番号の控え（任意）','text'],['note','詳細メモ','textarea']],
 souvenir:[['name','お土産の名前','text'],['recipient','渡す相手（任意）','text'],['shop','買うお店・場所（任意）','text'],['amount','予算・目安金額（任意）','number'],['currency','通貨','select',['TWD','JPY']],['note','メモ','textarea']],
 note:[['title','メモのタイトル','text'],['body','メモの内容','textarea']]
};
const collections={schedule:'schedule',place:'places',expense:'expenses',booking:'bookings',souvenir:'souvenirs',note:'notes'};
function openModal(kind,id){const col=data[collections[kind]],original=id?col.find(x=>x.id===id):null;modal={kind,id};const opts=controls[kind].map(([name,label,type,choices])=>{let value=original?.[name]??(name==='date'?(kind==='schedule'?selectedDate:''):'');if(type==='select')value=value||choices[0];const req=(name==='title'||name==='name'||name==='amount')?'required':'';let inner=type==='textarea'?`<textarea name="${name}" maxlength="3000">${safe(value)}</textarea>`:type==='select'?`<select name="${name}">${choices.map(v=>`<option value="${safe(v)}" ${v===value?'selected':''}>${safe(v==='TWD'?'台湾ドル (TWD)':v==='JPY'?'日本円 (JPY)':v)}</option>`).join('')}</select>`:`<input type="${type}" name="${name}" value="${safe(value)}" ${type==='number'?'min="0" step="0.01"':''} maxlength="180" ${req}>`;return `<div class="field"><label>${label}</label>${inner}</div>`}).join('');const titles={schedule:'予定',place:'スポット',expense:'支出',booking:'予約情報',souvenir:'お土産',note:'自由メモ'};document.getElementById('modalMount').innerHTML=`<div class="modal-backdrop" data-action="close-modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${id?'編集':'追加'} · ${titles[kind]}</h2><button class="icon-btn" style="font-size:24px" aria-label="閉じる" data-action="close-modal">×</button></div><form id="dataForm">${opts}<div class="modal-actions"><button type="button" class="secondary-btn" data-action="close-modal">キャンセル</button><button class="add-btn" type="submit">${id?'変更を保存':'追加する'}</button></div></form></div></div>`;const first=document.querySelector('#dataForm [name]');first?.focus()}
function closeModal(){document.getElementById('modalMount').innerHTML='';modal=null}
function exportData(){const str=JSON.stringify(data,null,2);const blob=new Blob([str],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='taiwan-trip-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('バックアップファイルを作成しました')}
function handleAction(target){const action=target.dataset.action,id=target.dataset.id;if(!action)return;
 if(action==='apply-itinerary'){const n=applyItinerary(data);store();render();toast(n+'件の旅程データを追加しました');return}if(action==='backup'){exportData();return}if(action==='import'){document.getElementById('importInput').click();return}
 if(action==='select-date'){selectedDate=target.dataset.date;render();return}if(action==='filter'){filter=target.dataset.filter;render();return}
 if(action==='close-modal'){closeModal();return}
 if(action==='close-modal-bg'&&target.classList.contains('modal-backdrop')){closeModal();return}
 if(action.startsWith('add-')){openModal(action.slice(4));return}
 if(action.startsWith('edit-')){openModal(action.slice(5),id);return}
 if(action.startsWith('delete-')){const kind=action.slice(7);if(kind==='packing'){data.packing=data.packing.filter(x=>x.id!==id)}else{const col=collections[kind];if(!col)return;if(!confirm('この項目を削除しますか？'))return;data[col]=data[col].filter(x=>x.id!==id)}store();render();toast('削除しました');return}
 if(action==='check-souvenir'){const x=data.souvenirs.find(v=>v.id===id);if(x){x.purchased=target.checked;store();render()}return}
 if(action==='visit-place'){const el=data.places.find(x=>x.id===id);if(el)el.visited=!el.visited;store();render();return}
 if(action==='reset'){if(confirm('旅行のデータをすべて初期化しますか？ この操作は元に戻せません。')){data=sample();selectedDate=data.trip.start;filter='すべて';store();setPage('home');toast('初期化しました')}return}
 }
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){e.preventDefault();setPage(nav.dataset.page);return}const button=e.target.closest('[data-action]');if(button&&button.dataset.action!=='check-packing'&&(button.dataset.action!=='close-modal-bg'||e.target===button)){e.preventDefault();handleAction(button)}});
document.addEventListener('input',e=>{if(e.target.id==='scratchpad'){data.trip.scratchpad=e.target.value;store()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.action==='check-packing'){const x=data.packing.find(v=>v.id===t.dataset.id);if(x){x.checked=t.checked;store();render()}}});
document.addEventListener('submit',e=>{const f=e.target;if(!['dataForm','tripSettings','addPacking'].includes(f.id))return;e.preventDefault();const form=new FormData(f);if(f.id==='addPacking'){const name=String(form.get('name')||'').trim();if(!name)return;data.packing.push({id:uid(),name,category:'追加した持ち物',checked:false});store();render();toast('持ち物を追加しました');return}
 if(f.id==='tripSettings'){const a=Object.fromEntries(form.entries());if(a.end<a.start){toast('帰国日を出発日以降にしてください');return}if((dd(a.end)-dd(a.start))/(86400000)>=30){toast('日程は30日以内にしてください');return}data.trip={...data.trip,...a};selectedDate=a.start;store();render();toast('設定を保存しました');return}
 if(f.id==='dataForm'){if(!modal)return;const {kind,id}=modal;const values=Object.fromEntries(form.entries());for(const key in values)values[key]=String(values[key]).trim();if(kind==='expense'&&!(Number(values.amount)>0)){toast('金額は0より大きくしてください');return}const collection=data[collections[kind]];if(id){const idx=collection.findIndex(x=>x.id===id);if(idx!==-1)collection[idx]={...collection[idx],...values}}else{collection.push({id:uid(),...values,...(kind==='place'?{visited:false}:kind==='souvenir'?{purchased:false}:{})})}store();closeModal();render();toast(id?'更新しました':'追加しました')}});
document.getElementById('importInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>2_000_000)throw new Error('ファイルが大きすぎます');const obj=JSON.parse(await file.text());if(!valid(obj))throw new Error('バックアップ形式が正しくありません');if(!confirm('現在のデータを読み込んだバックアップで置き換えますか？')){e.target.value='';return}data=normalize(obj);if(data.version<4)upgradeShuttle(data);store();selectedDate=data.trip.start;setPage('home');toast('バックアップを読み込みました')}catch(err){alert('読み込みできませんでした：'+err.message)}e.target.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
render();
})();
</script>
</body>
</html>
